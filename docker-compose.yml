version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo-app
    restart: always
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-18081}:18081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-geo_system}
      - DB_USER=${DB_USER:-geo_user}
      - DB_PASSWORD=${DB_PASSWORD:-geo_password}
      - TZ=Asia/Shanghai
      - SITE_URL=${SITE_URL:-http://localhost:18081}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/browser-profiles:/app/data/browser-profiles
      - ./data/logs:/app/data/logs
    networks:
      - geo-net

  postgres:
    image: postgres:16-alpine
    container_name: geo-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-geo_system}
      - POSTGRES_USER=${DB_USER:-geo_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-geo_password}
    volumes:
      - geo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geo_user} -d ${DB_NAME:-geo_system}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - geo-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo-worker
    restart: always
    env_file:
      - .env
    command: ["php", "bin/worker.php"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-geo_system}
      - DB_USER=${DB_USER:-geo_user}
      - DB_PASSWORD=${DB_PASSWORD:-geo_password}
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geo-net

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo-cron
    restart: always
    env_file:
      - .env
    command: >
      sh -c "while true; do php bin/cron.php; sleep 60; done"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-geo_system}
      - DB_USER=${DB_USER:-geo_user}
      - DB_PASSWORD=${DB_PASSWORD:-geo_password}
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - geo-net

volumes:
  geo-pgdata:

networks:
  geo-net:
    driver: bridge
